name: myrag

services:
  db-init:
    image: postgres:18-alpine
    container_name: myrag-db-init
    restart: "no"
    env_file: .env
    environment:
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./apps/server/src/db/init-database.sql:/init-database.sql:ro
    command:
      - sh
      - -c
      - |
        set -eu
        psql -h postgres -U "$$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
          -v db_name="$$DB_NAME" \
          -f /init-database.sql
    networks:
      - data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: myrag-server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      # 容器内走 infra_llm DNS；宿主开发仍用 .env 的 LLM_BASE_URL
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${SERVER_HOST_PORT:?SERVER_HOST_PORT is required}:8080"
    networks:
      - data
      - llm

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:?VITE_BASE is required}
    container_name: myrag-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_HOST_PORT:?WEB_HOST_PORT is required}:80"
    networks:
      - data

networks:
  data:
    name: infra_default
    external: true
  llm:
    name: infra_llm
    external: true

volumes:
  uploads:
  data:
