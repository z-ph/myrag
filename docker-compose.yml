name: myrag

services:
  db-init:
    image: postgres:18-alpine
    container_name: myrag-db-init
    restart: "no"
    env_file: .env
    environment:
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./apps/server/src/db/init-database.sql:/init-database.sql:ro
    command:
      - sh
      - -c
      - |
        set -eu
        psql -h postgres -U "$$DB_USER" -d postgres -v ON_ERROR_STOP=1 \
          -v db_name="$$DB_NAME" \
          -f /init-database.sql
    networks:
      - data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: myrag-server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      # LLM/LiteLLM 通过 cwc-infra 的宿主映射端口访问；宿主开发可直接复用同一变量
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      # 重排服务通过宿主端口访问 vLLM；图谱服务通过 data 网络访问 Neo4j
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://host.docker.internal:8003}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_MODEL: ${RERANK_MODEL:-bge-reranker-v2-m3}
      NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
      NEO4J_URI: http://neo4j:7474
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${SERVER_HOST_PORT:?SERVER_HOST_PORT is required}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:?VITE_BASE is required}
    container_name: myrag-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_HOST_PORT:?WEB_HOST_PORT is required}:80"
    networks:
      - data

networks:
  data:
    name: cwc-infra_default
    external: true
