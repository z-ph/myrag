services:
  postgres:
    image: postgres:18-alpine
    container_name: myrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag_password}
      POSTGRES_DB: ${DB_NAME:-rag}
      POSTGRES_USER: ${DB_USER:-rag}
    volumes:
      # PG 18+ 镜像要求挂载 /var/lib/postgresql（数据在版本子目录，便于 pg_upgrade）
      - postgres-data:/var/lib/postgresql
    # 宿主机 5432 常被其它服务占用，映射到 5433
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag} -d ${DB_NAME:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: myrag-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: myrag-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # 宿主机 6379 常被其它服务占用，映射到 6380
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: myrag-minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    # 宿主机 9000/9001 常被其它服务占用，映射到 9100/9101
    ports:
      - "9100:9000"
      - "9101:9101"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: myrag-server
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-myrag-documents}
      UPLOAD_DIR: /app/uploads
      DATA_DIR: /app/data
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8808:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: myrag-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  minio-data:
  uploads:
  data:
