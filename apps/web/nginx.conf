server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 分片上传单块 2MB，单文件上限 50MB；默认 1m 会 413
    client_max_body_size 64m;

    # 构建期 envsubst 只替换 VITE_BASE（与 vite base 同源）。
    # 根路径 /api/；子路径 /cwc/rag/ -> /cwc/rag/api/。后端无前缀，proxy_pass 剥掉。
    location ${VITE_BASE}api/ {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式问答：禁用缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # SPA：dist 按 VITE_BASE 落到 html 子目录，与 URL 前缀对齐
    location ${VITE_BASE} {
        try_files $uri $uri/ ${VITE_BASE}index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
