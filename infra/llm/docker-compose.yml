name: cwc-infra-llm

services:
  vllm-chat:
    image: docker.m.daocloud.io/vllm/vllm-openai:latest
    container_name: vllm
    runtime: nvidia
    environment:
      - MODELSCOPE_CACHE=/root/.cache/modelscope
    volumes:
      - ${MODELSCOPE_HOST_DIR:?MODELSCOPE_HOST_DIR is required}:/root/.cache/modelscope
      - ${CHAT_CACHE_DIR:?CHAT_CACHE_DIR is required}:/root/.cache/vllm
      - ${CHAT_NV_CACHE_DIR:?CHAT_NV_CACHE_DIR is required}:/root/.nv
    ipc: host
    expose:
      - "8000"
    ports:
      - "${CHAT_HOST_PORT:?CHAT_HOST_PORT is required}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CHAT_GPU:?CHAT_GPU is required}"]
              capabilities: [gpu]
    command: >
      --model ${CHAT_MODEL_PATH:?CHAT_MODEL_PATH is required}
      --served-model-name ${CHAT_MODEL_NAME:?CHAT_MODEL_NAME is required}
      --trust-remote-code
      --host 0.0.0.0
      --gpu-memory-utilization ${CHAT_GPU_MEMORY_UTILIZATION:?CHAT_GPU_MEMORY_UTILIZATION is required}
      --enable-auto-tool-choice
      --tool-call-parser ${CHAT_TOOL_CALL_PARSER:?CHAT_TOOL_CALL_PARSER is required}  
      --max-model-len ${CHAT_MAX_MODEL_LEN:?CHAT_MAX_MODEL_LEN is required}
      --reasoning-parser ${CHAT_REASONING_PARSER:?CHAT_REASONING_PARSER is required}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\").getcode() == 200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    restart: unless-stopped

  vllm-embedding:
    image: docker.m.daocloud.io/vllm/vllm-openai:latest
    container_name: embed1
    runtime: nvidia
    environment:
      - MODELSCOPE_CACHE=/root/.cache/modelscope
    volumes:
      - ${MODELSCOPE_HOST_DIR:?MODELSCOPE_HOST_DIR is required}:/root/.cache/modelscope
      - ${EMBEDDING_CACHE_DIR:?EMBEDDING_CACHE_DIR is required}:/root/.cache/vllm
      - ${EMBEDDING_NV_CACHE_DIR:?EMBEDDING_NV_CACHE_DIR is required}:/root/.nv
    ipc: host
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMBEDDING_GPU:?EMBEDDING_GPU is required}"]
              capabilities: [gpu]
    ports:
      - "${EMBEDDING_HOST_PORT:?EMBEDDING_HOST_PORT is required}:8000"
    command: >
      --model ${EMBEDDING_MODEL_PATH:?EMBEDDING_MODEL_PATH is required}
      --served-model-name ${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}
      --trust-remote-code
      --gpu-memory-utilization ${EMBEDDING_GPU_MEMORY_UTILIZATION:?EMBEDDING_GPU_MEMORY_UTILIZATION is required}
      --max-model-len ${EMBEDDING_MAX_MODEL_LEN:?EMBEDDING_MAX_MODEL_LEN is required}
      --host 0.0.0.0
      --runner pooling
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\").getcode() == 200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    depends_on:
      vllm-chat:
        condition: service_healthy
    restart: unless-stopped

  vllm-ocr:
    image: docker.m.daocloud.io/vllm/vllm-openai:latest
    container_name: vllm-ocr
    runtime: nvidia
    environment:
      - MODELSCOPE_CACHE=/root/.cache/modelscope
    volumes:
      - ${MODELSCOPE_HOST_DIR:?MODELSCOPE_HOST_DIR is required}:/root/.cache/modelscope
      - ${OCR_CACHE_DIR:?OCR_CACHE_DIR is required}:/root/.cache/vllm
      - ${OCR_NV_CACHE_DIR:?OCR_NV_CACHE_DIR is required}:/root/.nv
    ipc: host
    expose:
      - "8000"
    ports:
      - "${OCR_HOST_PORT:?OCR_HOST_PORT is required}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OCR_GPU:?OCR_GPU is required}"]
              capabilities: [gpu]
    command: >
      --model ${OCR_MODEL_PATH:?OCR_MODEL_PATH is required}
      --served-model-name ${OCR_MODEL_NAME:?OCR_MODEL_NAME is required}
      --trust-remote-code
      --host 0.0.0.0
      --gpu-memory-utilization ${OCR_GPU_MEMORY_UTILIZATION:?OCR_GPU_MEMORY_UTILIZATION is required}
      --max-model-len ${OCR_MAX_MODEL_LEN:?OCR_MAX_MODEL_LEN is required}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\").getcode() == 200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    depends_on:
      vllm-embedding:
        condition: service_healthy
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm1
    ports:
      - "${LITELLM_HOST_PORT:?LITELLM_HOST_PORT is required}:4000"
    volumes:
      - ./lite-llm.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      - UI_USERNAME=${LITELLM_UI_USERNAME:?LITELLM_UI_USERNAME is required}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD:?LITELLM_UI_PASSWORD is required}
    depends_on:
      - vllm-chat
      - vllm-embedding
      - vllm-ocr
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: always

networks:
  default:
    name: cwc-infra_llm
