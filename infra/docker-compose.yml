name: infra

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
    volumes:
      # PG 18+ 镜像要求挂载 /var/lib/postgresql（数据在版本子目录，便于 pg_upgrade）
      - postgres-data:/var/lib/postgresql
    # 宿主映射端口由 .env 的 POSTGRES_HOST_PORT 控制（容器内固定 5432）
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_HOST_PORT:?QDRANT_HOST_PORT is required}:6333"
      - "${QDRANT_GRPC_HOST_PORT:?QDRANT_GRPC_HOST_PORT is required}:6334"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # 宿主映射端口由 .env 的 REDIS_HOST_PORT 控制（容器内固定 6379）
    ports:
      - "${REDIS_HOST_PORT:?REDIS_HOST_PORT is required}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    # 宿主映射端口由 .env 的 MINIO_HOST_PORT / MINIO_CONSOLE_HOST_PORT 控制（容器内固定 9000/9101）
    ports:
      - "${MINIO_HOST_PORT:?MINIO_HOST_PORT is required}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:?MINIO_CONSOLE_HOST_PORT is required}:9101"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  default:
    name: infra_default

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  minio-data:
